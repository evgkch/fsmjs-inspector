<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>fsmjs — inspector</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Onest:wght@200..900&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <main>
            <div class="bar">
                <label
                    >Schema
                    <select id="sample"></select>
                </label>
                <label
                    >Start
                    <select id="start"></select>
                </label>
                <button
                    id="reset"
                    class="reset"
                    title="forget the run and stand at the start again"
                >
                    ↺ reset
                </button>
                <label class="flag" title="no state is current; nothing fires">
                    <input type="checkbox" id="explore" />
                    <span class="track"></span>
                    explore
                </label>
            </div>

            <div class="panes">
                <!-- The editor is put in here: it is three layers that have to agree on every
                     metric, so it is built where those metrics are, and not written out twice. -->
                <section class="pane" id="text">
                    <ul
                        class="shape"
                        id="shape"
                        aria-label="Shape of the graph"
                    >
                        <li>
                            <span class="label">states</span
                            ><span class="value" id="n-states">—</span>
                        </li>
                        <li>
                            <span class="label">reachable</span
                            ><span class="value" id="n-reachable">—</span>
                        </li>
                        <li>
                            <span class="label">unreachable</span
                            ><span class="value" id="n-unreachable">—</span>
                        </li>
                        <li>
                            <span class="label">terminal</span
                            ><span class="value" id="n-terminal">—</span>
                        </li>
                    </ul>
                </section>

                <section class="pane" id="inspector"></section>
            </div>
        </main>

        <script type="module" src="./src/app/main.ts"></script>
    </body>
</html>
