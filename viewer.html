<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>fsmjs — inspecting</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Onest:wght@200..900&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <main>
            <!-- Not a menu: these are the machines being inspected, and the page is on one of
                 them. Hidden until there is one, because a bar with nothing in it is a control
                 that does not work. -->
            <div class="bar" id="bar" hidden>
                <span class="tag">inspecting</span>
                <!-- Who is out there. Shown only when there is a choice to make: one machine is
                     not a list, it is the thing you are looking at. -->
                <div id="who" class="roster" hidden></div>
                <!-- Three drawings of one machine. Which of them you want depends on what you are
                     looking for, so it is asked rather than assumed. -->
                <div class="panels" id="panels"></div>
            </div>

            <!-- What is being inspected, said as a page says what it is about: the machine's name,
                 and the line its author wrote about what it is for. -->
            <header class="what" id="what" hidden>
                <h2 class="name" id="name"></h2>
                <p class="note" id="note" hidden></p>
            </header>

            <!-- The machine's alphabet: three legends, no frame, each its own switch. -->
            <div class="alphabet" id="alphabet" hidden></div>

            <div class="panes" id="work" hidden>
                <!-- The schema, read and not written. The editor is three layers that have to
                     agree on every metric, so it is built where those metrics are. -->
                <section class="pane" id="text"></section>

                <!-- The classic diagram: the same schema as one row of states and arcs. -->
                <section class="pane" id="chart"></section>

                <!-- And the drawing under them, which is one drawing with a gap in it. -->
                <section class="pane" id="watch"></section>
            </div>

            <!-- Before anything has said hello. The dot is the only moving thing on the page, and
                 it moves while the wire is down. -->
            <section class="wait" id="wait">
                <span class="dot"></span>
                <p class="said" id="said"></p>
                <pre class="snippet" id="line" hidden></pre>
            </section>
        </main>

        <script type="module" src="./src/app/watch.ts"></script>
    </body>
</html>
